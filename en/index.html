<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICIKLOPOPRAVLJAONA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1m:wght@400;700&display=swap');

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --accent: #00ff41; 
            --border: 2px solid #333;
        }
        

        body { background-color: var(--bg); color: var(--text); font-family: 'M PLUS 1m', monospace; line-height: 1.4; margin: 0; padding: 20px; text-transform: lowercase; }
        header, section, .archive-item { background-color: var(--bg); border: var(--border); padding: 20px; margin-bottom: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; position: relative; }
        h1 { font-size: 3rem; margin: 0; letter-spacing: -2px; color: var(--accent); font-weight: 700; }
        nav { display: flex; gap: 10px; }

        /* UNIFIED BUTTON STYLING */
        .btn, .lang-current { background: none; border: var(--border); color: var(--text); padding: 8px 12px; font-size: 0.9rem; font-family: 'M PLUS 1m', monospace; text-transform: lowercase; text-decoration: none; cursor: pointer; box-sizing: border-box; display: inline-flex; align-items: center; height: 38px; margin: 0; }
        .lang-current { color: #ff8c00; border-color: #ff8c00; }
        .btn:hover { background: var(--accent); color: #000; }
        .btn.active { background: var(--accent) !important; color: #000 !important; border-color: var(--accent); }

        /* DROPDOWN */
        .lang-selector { position: relative; display: inline-block; z-index: 500; }
        .lang-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: -2px;
            background: var(--bg);
            border: var(--border);
            border-color: #ff8c00;
            z-index: 501;
            min-width: 100%;
            box-sizing: border-box;
        }
        .lang-dropdown.open { display: block; }
        .lang-dropdown a { display: block; padding: 8px 12px; color: #ff8c00; text-decoration: none; font-size: 0.9rem; white-space: nowrap; text-align: left; }
        .lang-dropdown a:hover { background: #ff8c00; color: #000; }

        /* HAMBURGER */
        .hamburger { display: none; cursor: pointer; border: var(--border); color: var(--accent); padding: 5px 12px; font-size: 1.4rem; }

        .section-link { text-decoration: none; color: inherit; display: block; }
        .section-link h2:hover { background: var(--accent); color: #000; cursor: pointer; }

        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        h2 { border-bottom: var(--border); padding-bottom: 5px; color: var(--accent); margin-top: 0; font-weight: 700; transition: 0.2s; }
        img { max-width: 100%; height: auto; filter: grayscale(100%) contrast(120%); border: 1px solid #444; display: block; margin-bottom: 10px; }
        img:hover { filter: none; border-color: var(--accent); }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; border: 1px solid #444; background: #111; }
        .gallery-grid img { margin-bottom: 0; border: 2px solid #000; }
        .comic-frame { background: #fff; padding: 10px; border: 4px solid #000; color: #000; }
        .comic-frame img { filter: none; border: 2px solid #000; }
        .comic-caption { font-weight: 700; text-align: center; font-size: 1.2rem; margin-top: 10px; }
        .tour-images { display: flex; gap: 10px; margin-top: 15px; }
        .tour-images img { width: 48%; }
        .archive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: none; padding: 0; }
        .archive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: start; }
        .archive-item { background: #111; padding: 15px; display: flex; flex-direction: column; transition: all 0.2s ease; margin-bottom: 0; }
        .archive-item:hover { border-color: var(--accent); background: #1a1a1a; cursor: pointer; }
        .btn-sm { border: 1px solid var(--accent); color: var(--accent); padding: 2px 8px; text-decoration: none; font-size: 0.7rem; }
        footer { text-align: center; font-size: 0.8rem; margin-top: 40px; padding: 20px; border-top: var(--border); opacity: 0.6; }

        @media (max-width: 768px) {
            header { flex-wrap: nowrap; padding: 10px 15px; }
            h1 { font-size: 1.4rem; letter-spacing: -1px; } 
            .hamburger { display: block; }
            nav { display: none; flex-direction: column; width: 100%; background: var(--bg); border: var(--border); padding: 10px; position: absolute; top: 100%; left: 0; z-index: 100; box-sizing: border-box; }
            nav.open { display: flex; }
            .container { display: flex; flex-direction: column; }
            .archive-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<header>
    <a href="/hr/index.html" style="text-decoration: none;"> 
        <h1 style="color: var(--accent); margin: 0;">BICIKLOPOPRAVLJAONA</h1> 
    </a>
    <nav>
        <a href="index.html" class="btn">[ home ]</a>
        <a href="about.html" class="btn">[ about ]</a>
        <a href="q&a.html" class="btn">[ q & a ]</a>
        
        <div class="lang-selector">
            <button class="lang-current" onclick="toggleLang(event)">[ en ▾ ]</button>
            
            <div class="lang-dropdown" id="lang-dropdown">
                <a href="/hr/index.html">[ hr ]</a>
            </div>
        </div>
    </nav>
</header>

<div class="container">
    <main>
        <section id="novosti"><div id="latest-post"><h2>news_from_the_workshop: ...</h2><h3>"loading..."</h3><p></p></div></section>
        <section id="arhiva"><div class="archive-header"><h2>old_logs</h2><nav><a href="#" id="prev-btn" class="btn-sm">&lt;&lt; older</a><a href="#" id="next-btn" class="btn-sm">newer &gt;&gt;</a></nav></div><div id="archive-container" class="archive-grid"></div></section>
        <a href="en/comic.html" class="section-link" id="strip-link"><section id="strip"><h2>weekly_comic</h2><div id="comic-container" class="comic-frame"><img src="https://m2zk.neocities.org/bicpopstrip.jpg"><div class="comic-caption">"weekly_comic"</div></div></section></a>
        <a href="en/microtouring.html" class="section-link" id="tour-link"><section id="micro-touring"><h2>micro_touring</h2><div id="tour-content"><p>...</p><div class="tour-images"><img src="https://m2zk.neocities.org/zine/sljeme.jpg"><img src="https://m2zk.neocities.org/zine/samobor.jpg"></div></div></section></a>
    </main>
    <aside>
        <section id="lokacija"><h2>location</h2><p>gunduliceva 1<br>dvoriste<br>10000 zagreb</p><p>tuesday: 18:00 - 20:00</p></section>
        <a href="gallery.html" class="section-link" id="galerija-link"><section id="galerija"><h2>gallery</h2><div id="gallery-container" class="gallery-grid"><img src="https://m2zk.neocities.org/image3.jpg"><img src="https://m2zk.neocities.org/image4.jpg"></div></section></a>
    </aside>
</div>
<footer><p>Bicpop Bike Kitchen - Copyleft 2026</p></footer>

<script>
    function toggleMenu() { document.getElementById('main-nav').classList.toggle('open'); }
    function toggleLang(event) { event.stopPropagation(); document.getElementById('lang-dropdown').classList.toggle('open'); }
    document.addEventListener('click', function() { document.getElementById('lang-dropdown').classList.remove('open'); });

    let allPosts = []; let archiveStart = 1; const itemsToShow = 2;
    function renderBlog() {
        if (allPosts.length === 0) return;
        const latest = allPosts[0];
        document.getElementById('latest-post').innerHTML = `<h2>news_from_the_workshop: ${latest.date}</h2><h3>"${latest.title}"</h3><p>${latest.content}</p>`;
        const archiveItems = allPosts.slice(archiveStart, archiveStart + itemsToShow);
        document.getElementById('archive-container').innerHTML = archiveItems.map(post => `<div class="archive-item"><h4>${post.title}</h4><p>${post.content.substring(0, 100)}...</p></div>`).join('');
    }
    fetch('/hr/data/blog.json').then(res => res.json()).then(data => { allPosts = (data.entries || []).reverse(); renderBlog(); });
</script>
</body>
</html>
