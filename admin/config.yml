backend:
  name: git-gateway
  branch: main
  repo: biciklopopravljaona/web-arhiva

media_folder: "hr/images/uploads"
public_folder: "/hr/images/uploads"

sortable_fields: ['date']

collections:
  - name: "blog"
    label: "Novosti (Blog)"
    files:
      - name: "posts_hr"
        label: "Hrvatski Postovi"
        file: "hr/data/blog.json"
        fields: &blog_fields
          - name: "entries"
            label: "Postovi"
            widget: "list"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD"}
              - {label: "Sadržaj", name: "content", widget: "text"}
      
      - name: "posts_en"
        label: "English Posts"
        file: "en/data/blog_en.json"
        fields: *blog_fields

  - name: "shared_content"
    label: "Shared (HR & EN)"
    files:
      - name: "tours"
        label: "Micro-Touring"
        file: "hr/data/tours.json"
        fields:
          - name: "entries"
            label: "Ture"
            widget: "list"
            fields:
              - {label: "Naslov Ture", name: "title", widget: "string"}
              - {label: "Opis", name: "text", widget: "text"}
              - {label: "Glavna Slika", name: "image", widget: "image"}

      - name: "galerija"
        label: "Galerija"
        file: "hr/data/gallery.json"
        fields:
          - name: "photos"
            label: "Fotke"
            widget: "list"
            fields:
              - {label: "Naslov fotke", name: "title", widget: "string"}
              - {label: "Fotka", name: "image", widget: "image"}
              - {label: "Datum", name: "date", widget: "string", required: false, hint: "npr. 2026.01.15"}
              - label: "Folder"
                name: "folder"
                widget: "select"
                options:
                  - {label: "Terenske voznje 2026", value: "terenske_voznje_2026"}
                  - {label: "Radiona kaos winter", value: "radiona_kaos"}
                  - {label: "Donacije i projekti", value: "donacije"}
                  - {label: "Nocna kriticna masa", value: "nocne_voznje"}
                  
      - name: "strip"
        label: "Strip"
        file: "hr/data/strip.json"
        fields:
          - name: "episodes"
            label: "Epizode"
            widget: "list"
            fields:
              - {label: "Naslov Epizode", name: "title", widget: "string"}
              - {label: "Datum", name: "date", widget: "string"}
              - {label: "Strip Slika", name: "image", widget: "image"}